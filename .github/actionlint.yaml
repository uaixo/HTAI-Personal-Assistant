# actionlint knows only the GitHub-hosted runner labels of its own release.
# The arm64 standard runners are newer than some pins and would otherwise read
# as "unknown runner label" and hide the real findings, unless this file
# declares them. This fork is user-owned, so every workflow runs on standard
# hosted runners: larger-runner labels never start here.
self-hosted-runner:
  labels:
    - ubuntu-24.04-arm
    - windows-11-arm
